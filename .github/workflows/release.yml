name: Release

# 匹配推送的 tag,例如 v0.1.0
on:
  push:
    tags:
      - 'v*.*.*'

# 写权限:发 release、传 asset 要这些
permissions:
  contents: write

jobs:
  # ============ 后端:Rust 多平台原生编译 ============
  # 每个 platform 用对应 runner,避免交叉编译问题
  backend-linux:
    name: backend (linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build release binary
        working-directory: backend
        run: |
          cargo build --release
          mkdir -p ../dist-artifacts
          cp target/release/admin-starter-backend ../dist-artifacts/admin-starter-backend-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: admin-starter-backend-linux-x64
          path: dist-artifacts/admin-starter-backend-linux-x64
          if-no-files-found: error

  backend-windows:
    name: backend (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Build release binary
        working-directory: backend
        run: |
          cargo build --release
          mkdir -Force ..\dist-artifacts
          Copy-Item target\release\admin-starter-backend.exe ..\dist-artifacts\admin-starter-backend-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: admin-starter-backend-windows-x64
          path: dist-artifacts/admin-starter-backend-windows-x64.exe
          if-no-files-found: error

  backend-macos:
    name: backend (macos aarch64)
    # macos-latest 是 M1,直接出 aarch64 binary(Intel Mac 已经 EOL)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Build release binary
        working-directory: backend
        run: |
          cargo build --release
          mkdir -p ../dist-artifacts
          cp target/release/admin-starter-backend ../dist-artifacts/admin-starter-backend-macos-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: admin-starter-backend-macos-aarch64
          path: dist-artifacts/admin-starter-backend-macos-aarch64
          if-no-files-found: error

  # ============ 前端:Vue 静态构建 ============
  frontend:
    name: frontend (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Zip dist
        working-directory: frontend
        run: |
          mkdir -p ../dist-artifacts
          (cd dist && zip -r ../dist-artifacts/admin-starter-frontend-${{ github.ref_name }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: admin-starter-frontend
          path: dist-artifacts/admin-starter-frontend-${{ github.ref_name }}.zip
          if-no-files-found: error

  # ============ 汇总:创建 Release 并附 assets ============
  publish:
    name: publish release
    needs: [backend-linux, backend-windows, backend-macos, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}