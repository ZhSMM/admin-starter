name: Release

# 匹配推送的 tag,例如 v0.1.0
on:
  push:
    tags:
      - 'v*.*.*'

# 写权限:发 release、传 asset 要这些
permissions:
  contents: write

jobs:
  # ============ 后端:Rust 多平台编译 ============
  backend:
    name: backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: admin-starter-backend-linux-x64
            binary: admin-starter-backend
          - target: x86_64-apple-darwin
            artifact: admin-starter-backend-macos-x64
            binary: admin-starter-backend
          - target: x86_64-pc-windows-m64
            artifact: admin-starter-backend-windows-x64.exe
            binary: admin-starter-backend.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Build release binary
        working-directory: backend
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../dist-artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ../dist-artifacts/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/${{ matrix.artifact }}
          if-no-files-found: error

  # ============ 前端:Vue 静态构建 ============
  frontend:
    name: frontend (dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Zip dist
        working-directory: frontend
        run: |
          mkdir -p ../../dist-artifacts
          (cd dist && zip -r ../../dist-artifacts/admin-starter-frontend-${{ github.ref_name }}.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-starter-frontend
          path: dist-artifacts/admin-starter-frontend-${{ github.ref_name }}.zip
          if-no-files-found: error

  # ============ 汇总:创建 Release 并附 assets ============
  publish:
    name: publish release
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}